name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.14.4"
      - name: Format and lint
        run: gradle ktlintCheck :app:lintDebug
      - name: Unit tests with coverage gate
        run: gradle :app:testDebugUnitTest :app:koverVerifyDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug

  ci-ok:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo ok
